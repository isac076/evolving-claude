<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lumen</title>
<script>
  // On a web host, "/evolving-claude" (no slash) makes the browser look for
  // style.css and src/ in the wrong folder. Add the slash so everything loads.
  if (location.protocol.indexOf('http') === 0 && !/\/$|\.\w+$/.test(location.pathname)) {
    location.replace(location.pathname + '/' + location.search + location.hash);
  }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel" id="status"><span id="clock">Day 1</span><span id="weather"></span><span id="restored">Lanterns lit: 0</span><span id="friends"></span><button id="btn-sound" aria-label="Sound"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M16 9l6 6M22 9l-6 6"/></svg></button></div>
  <div class="panel" id="goals"></div>
  <canvas id="minimap" title="Map (M)"></canvas>
  <div id="toast"></div>
  <div id="bottom">
    <div class="panel" id="inventory"></div>
    <div id="hint"></div>
  </div>
  <div id="touch-buttons">
    <button id="btn-gather">Gather</button>
    <button id="btn-craft">Craft</button>
  </div>
</div>

<div class="panel" id="craft">
  <div class="craft-head"><h2>Craft</h2><button id="craft-close" aria-label="Close">×</button></div>
  <div id="craft-list"></div>
  <button id="btn-pickup">Pick up a building <small>(X)</small></button>
</div>

<div id="bigmap">
  <div class="panel bigmap-frame">
    <div class="bigmap-head"><h2>Map</h2><span id="bigmap-info"></span><button id="bigmap-close" aria-label="Close map">×</button></div>
    <canvas id="bigmap-canvas"></canvas>
    <div class="bigmap-foot">
      <span>Drag to look around · scroll to zoom · M to close</span>
      <span class="bigmap-buttons"><button id="bigmap-out" aria-label="Zoom out">−</button><button id="bigmap-home" aria-label="Back to you">◎</button><button id="bigmap-in" aria-label="Zoom in">+</button></span>
    </div>
  </div>
</div>

<div id="title">
  <h1>Lumen</h1>
  <p>The world has faded to grey. You are its last small light.</p>
  <p>Gather, craft and build — and bring the colour back, one lantern at a time.</p>
  <div class="title-buttons">
    <button id="btn-continue">Continue</button>
    <button id="btn-new">New world</button>
  </div>
</div>

<!-- Scripts load in order. New files must be added here. -->
<script src="src/core/rng.js"></script>
<script src="src/core/noise.js"></script>
<script src="src/core/input.js"></script>
<script src="src/audio/sound.js"></script>
<script src="src/audio/ambience.js"></script>
<script src="src/data/content.js"></script>
<script src="src/data/goals.js"></script>
<script src="src/data/creatures.js"></script>
<script src="src/data/weather.js"></script>
<script src="src/data/villagers.js"></script>
<script src="src/world/world.js"></script>
<script src="src/world/explore.js"></script>
<script src="src/world/creatures.js"></script>
<script src="src/world/weather.js"></script>
<script src="src/world/villagers.js"></script>
<script src="src/game/player.js"></script>
<script src="src/game/save.js"></script>
<script src="src/game/crafting.js"></script>
<script src="src/render/sprites.js"></script>
<script src="src/render/workshop_sprites.js"></script>
<script src="src/render/creature_sprites.js"></script>
<script src="src/render/weather_fx.js"></script>
<script src="src/render/villager_sprites.js"></script>
<script src="src/render/renderer.js"></script>
<script src="src/ui/ui.js"></script>
<script src="src/ui/minimap.js"></script>
<script src="src/ui/goals.js"></script>
<script src="src/main.js"></script>
</body>
</html>
